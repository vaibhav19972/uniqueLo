# ===================================================================
# UniqueLo — Production Docker Compose Stack
# ===================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: uniquelo-web:latest
    container_name: uniquelo_storefront
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
