<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo/06-uniquelo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="UniqueLo — Hand-Embroidered Essentials. Made in India. Built to last. Numbered capsule runs in Zardozi, Kantha, Chikankari and Kashmiri crewel."
    />
    <title>UniqueLo — Hand-Embroidered Essentials. Made in India. Built to Last.</title>

    <!-- Canonical light streetwear theme lock: avoids OS dark-mode contrast collisions -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-mode', 'light');
          document.documentElement.style.colorScheme = 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#ffffff');
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'light');
        }
      })();
    </script>

    <!-- Brand fonts are self-hosted in /public/fonts and declared in
         src/styles/fonts.css. Do NOT add Google Fonts here —
         see docs/02-design-system §12.1. -->
  </head>
  <body class="bg-white text-neutral-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
